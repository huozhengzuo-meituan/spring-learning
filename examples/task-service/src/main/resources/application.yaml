server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: task-service
  datasource:
    url: jdbc:h2:mem:tasks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
  profiles:
    group:
      infra: [postgres]
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
learning:
  security:
    writer-password: ${LEARNING_WRITER_PASSWORD:writer-local-only}
    reader-password: ${LEARNING_READER_PASSWORD:reader-local-only}
